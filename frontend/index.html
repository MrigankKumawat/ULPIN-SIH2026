<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ULPIN 3D Property Viewer</title>

  <!-- CesiumJS core library + widget styles, loaded from CDN (no build step needed for this MVP) -->
  <script src="https://unpkg.com/cesium@1.144.0/Build/Cesium/Cesium.js"></script>
  <link href="https://unpkg.com/cesium@1.144.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="title">ULPIN 3D Property Viewer</div>
  <div id="loading">Loading apartments.glb…</div>

  <div id="cesiumContainer"></div>

  <div id="infoPanel" class="hidden">
    <div id="infoPanelHeader">
      <span>Property Details</span>
      <button id="infoPanelClose" aria-label="Close">&times;</button>
    </div>
    <dl id="infoPanelBody"></dl>
  </div>

  <!-- must load after Cesium is defined on window -->
  <script src="main.js"></script>
</body>
</html>
